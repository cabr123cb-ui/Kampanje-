<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7ca66a">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>🧩 Kampanjeøvelser</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🧩 Kampanjeøvelser</h1>
      <div class="week" id="week"></div>
    </div>
    <button class="newweek" onclick="newWeek()">＋ Ny uke</button>
  </header>

  <div id="list"></div>

  <button class="add" onclick="showNew()">＋ Legg til kampanjeøvelse</button>
  <div class="new" id="newBox">
    <input id="newName" placeholder="Skriv inn øvelsen">
    <button class="save" onclick="addExercise()">Legg til</button>
  </div>

  <section class="history card">
    <h2>📊 Ukehistorikk</h2>
    <div id="history"></div>
  </section>

  <div class="footer">Velg selv hvilke kampanjeøvelser du vil ha denne uken.</div>
</div>

<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js"));
}
</script>
</body>
</html>
